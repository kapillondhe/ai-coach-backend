name: Deploy to FastAPI Cloud
on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned by commit SHA (tag in the comment) so a moved tag can't change CI.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
      # uv.lock must match pyproject.toml, and requirements.txt must match uv.lock.
      - run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: |
          uv export --frozen --extra dev --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright
      # tests/conftest.py supplies dummy settings, so no secrets/DB/network are needed.
      - run: uv run --no-sync pytest -q

  migrations:
    # Applies every migration to an empty Postgres, then checks the ORM models match it.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OPENROUTER_API_KEY: unused
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync alembic check

  deploy:
    needs: [checks, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Pinned like `checks`: an unpinned runner default (3.15) has no pydantic-core wheel.
          python-version: "3.14"
      - run: uv run --frozen fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
