[project]
name = "ai-coach-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.0",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
    "pydantic-ai-slim[anthropic,mcp]==2.37.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
