[project]
name = "ai-coach-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.0",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
    "pydantic-ai-slim[openai,mcp]==2.37.0",
    "cryptography==50.0.1",
    "arize-phoenix-otel==0.17.1",
    "openinference-instrumentation-pydantic-ai==0.1.24",
    "openinference-semantic-conventions==0.1.34",
    "opentelemetry-instrumentation-fastapi==0.65b0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1", "pytest-asyncio==1.2.0", "ruff==0.14.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "ASYNC", # flake8-async
]
ignore = [
    "E501", # line length is handled by the formatter / not worth blocking on
    "B008", # `Depends(...)` in argument defaults is the standard FastAPI DI pattern
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
